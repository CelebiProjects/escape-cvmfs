name: Build Celebi Tarball

on:
  push:
    branches: [ci/el9-tarball-build]
  workflow_dispatch:
    inputs:
      celebi_ref:
        description: Full Celebi commit SHA to build
        required: true

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - name: Install EL9 build tools
        run: |
          dnf install -y ca-certificates git gzip tar gcc gcc-c++ make \
            python3.11 python3.11-devel python3.11-pip
          dnf clean all

      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Validate source revision
        env:
          SOURCE_REF: ${{ inputs.celebi_ref || 'f443f451dc84e4dd5893ce242c9e3dcb4e8e75e3' }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]'

      - name: Checkout Celebi
        uses: actions/checkout@v4
        with:
          repository: CelebiProjects/Celebi
          ref: ${{ inputs.celebi_ref || 'f443f451dc84e4dd5893ce242c9e3dcb4e8e75e3' }}
          path: source-celebi

      - name: Build tarball
        env:
          PYTHON_BIN: python3.11
        run: |
          export CELEBI_SOURCE_DIR="$GITHUB_WORKSPACE/source-celebi"
          bash celebi/make_tarball.sh
          cd celebi
          sha256sum --check celebi-*.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: celebi
          path: |
            celebi/celebi-*.tar.gz
            celebi/celebi-*.tar.gz.sha256
          if-no-files-found: error
