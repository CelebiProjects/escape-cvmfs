name: Build Yuki Tarball

on:
  push:
    branches: [ci/el9-tarball-build]
  workflow_dispatch:
    inputs:
      yuki_ref:
        description: Full Yuki commit SHA to build
        required: true
      celebi_ref:
        description: Full Celebi commit SHA to bundle
        required: true
      rabbitmq_version:
        description: Optional conda-forge RabbitMQ version (empty uses the pinned default)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - name: Install EL9 build tools
        run: |
          dnf install -y ca-certificates git gzip tar bzip2 which gcc gcc-c++ make
          dnf clean all

      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Validate source revisions
        env:
          YUKI_REF: ${{ inputs.yuki_ref || '7d252f088e032af298406c19438f186ac2707ef0' }}
          CELEBI_REF: ${{ inputs.celebi_ref || 'f443f451dc84e4dd5893ce242c9e3dcb4e8e75e3' }}
        run: |
          [[ "$YUKI_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CELEBI_REF" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout Yuki
        uses: actions/checkout@v4
        with:
          repository: CelebiProjects/Yuki
          ref: ${{ inputs.yuki_ref || '7d252f088e032af298406c19438f186ac2707ef0' }}
          path: source-yuki

      - name: Checkout Celebi
        uses: actions/checkout@v4
        with:
          repository: CelebiProjects/Celebi
          ref: ${{ inputs.celebi_ref || 'f443f451dc84e4dd5893ce242c9e3dcb4e8e75e3' }}
          path: source-celebi

      - name: Install Miniforge build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: yuki-build
          python-version: '3.11'
          channels: conda-forge

      - name: Install build tools
        shell: bash -el {0}
        run: python -m pip install --disable-pip-version-check conda-pack

      - name: Build tarball
        shell: bash -el {0}
        env:
          PYTHON_BIN: python
          CONDA_BIN: conda
          CONDA_PACK_BIN: conda-pack
          RABBITMQ_VERSION: ${{ inputs.rabbitmq_version }}
        run: |
          export YUKI_SOURCE_DIR="$GITHUB_WORKSPACE/source-yuki"
          export CELEBI_SOURCE_DIR="$GITHUB_WORKSPACE/source-celebi"
          bash yuki/make_tarball.sh
          cd yuki
          sha256sum --check yuki-*.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuki
          path: |
            yuki/yuki-*.tar.gz
            yuki/yuki-*.tar.gz.sha256
          if-no-files-found: error
